<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgSquare" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222B45" />
      <stop offset="50%" stop-color="#192036" />
      <stop offset="100%" stop-color="#101524" />
    </linearGradient>
    <radialGradient id="bgAmbient" cx="300" cy="300" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B4D7A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#101524" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="300" y1="84" x2="300" y2="556" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E9EEF6" />
    </linearGradient>
    <linearGradient id="hubGrad" x1="232" y1="250" x2="368" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#E03131" />
    </linearGradient>
    <linearGradient id="pointerGrad" x1="300" y1="42" x2="300" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#E03131" />
    </linearGradient>
    <filter id="wheelDrop" x="30" y="54" width="540" height="540" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#070A12" flood-opacity="0.6" />
    </filter>
    <filter id="hubDrop" x="190" y="214" width="220" height="220" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0B101D" flood-opacity="0.38" />
    </filter>
    <filter id="pointerDrop" x="220" y="24" width="160" height="160" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0B101D" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full-bleed Sharp Square Background (No rounded corners, no transparency) -->
  <rect x="0" y="0" width="600" height="600" fill="url(#bgSquare)" />
  <rect x="0" y="0" width="600" height="600" fill="url(#bgAmbient)" />

  <!-- Outer Wheel Rim -->
  <g filter="url(#wheelDrop)">
    <circle cx="300" cy="322" r="232" fill="url(#rimGrad)" />
    <circle cx="300" cy="322" r="208" fill="#192036" />
  </g>

  <!-- 6 High-Contrast Roulette Slices (Rotated -30 deg so top winner slice is centered) -->
  <g transform="rotate(-30 300 322)">
    <!-- Slice 1: Sunny Gold (Top Winner) -->
    <path d="M300 322 L300 120 A202 202 0 0 1 474.94 221 Z" fill="#FFD43B" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <!-- Slice 2: Coral Tangerine -->
    <path d="M300 322 L474.94 221 A202 202 0 0 1 474.94 423 Z" fill="#FF8769" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <!-- Slice 3: Mint Emerald -->
    <path d="M300 322 L474.94 423 A202 202 0 0 1 300 524 Z" fill="#38D9A9" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <!-- Slice 4: Sky Azure -->
    <path d="M300 322 L300 524 A202 202 0 0 1 125.06 423 Z" fill="#4DABF7" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <!-- Slice 5: Soft Violet -->
    <path d="M300 322 L125.06 423 A202 202 0 0 1 125.06 221 Z" fill="#9775FA" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <!-- Slice 6: Rose Pink -->
    <path d="M300 322 L125.06 221 A202 202 0 0 1 300 120 Z" fill="#F783AC" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />

    <!-- Bold Segment Dots (Radius 146) for clear wheel motion cue at small sizes -->
    <circle cx="373" cy="195.6" r="13" fill="#E67700" />
    <circle cx="446" cy="322" r="12" fill="#FFFFFF" opacity="0.92" />
    <circle cx="373" cy="448.4" r="12" fill="#FFFFFF" opacity="0.92" />
    <circle cx="227" cy="448.4" r="12" fill="#FFFFFF" opacity="0.92" />
    <circle cx="154" cy="322" r="12" fill="#FFFFFF" opacity="0.92" />
    <circle cx="227" cy="195.6" r="12" fill="#FFFFFF" opacity="0.92" />
  </g>

  <!-- Center Hub with Bold Fork & Spoon Icon (Lunch/Dining Identity) -->
  <g filter="url(#hubDrop)">
    <circle cx="300" cy="322" r="88" fill="#FFFFFF" />
    <circle cx="300" cy="322" r="72" fill="url(#hubGrad)" />

    <!-- Fork (Left) -->
    <path d="M264 282 V303 C264 316 292 316 292 303 V282" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M278 282 V309" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" />
    <path d="M278 312 V362" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" />

    <!-- Spoon (Right) -->
    <ellipse cx="322" cy="297" rx="16" ry="21" fill="#FFFFFF" />
    <path d="M322 314 V362" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" />
  </g>

  <!-- Top Pointer Pin -->
  <g filter="url(#pointerDrop)">
    <path d="M300 156 L256 82 C246 65 258 42 279 42 H321 C342 42 354 65 344 82 Z" fill="#FFFFFF" />
    <path d="M300 140 L266 83 C260 72 267 54 281 54 H319 C333 54 340 72 334 83 Z" fill="url(#pointerGrad)" />
    <circle cx="300" cy="76" r="12" fill="#FFFFFF" />
  </g>
</svg>
